<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Genesys Agentic Virtual Agent Demo</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: linear-gradient(135deg, #4facfe, #00f2fe);
      color: #ffffff;
      text-align: center;
    }

    .agent-container {
      margin-top: 20px;
    }
  </style>
</head>

<body>

  <h1>Genesys Agentic Virtual Agent Demo</h1>

  <div class="agent-container">
    <label for="languageSelect">Choose Language:</label><br>
    <select id="languageSelect" onchange="changeLanguage()">
      <option value="en-GB">English (UK)</option>
      <option value="fr-FR">Français (FR)</option>
      <option value="de-DE">Deutsch (DE)</option>
    </select>

    <br><br>

    <label for="webUserEmail">Enter Email Address:</label><br>
    <input type="email" id="webUserEmail" name="webUserEmail" onchange="saveEmail()">
  </div>

  <script>
    (function (g, e, n, es, ys) {
      g['_genesysJs'] = e;
      g[e] = g[e] || function () {
        (g[e].q = g[e].q || []).push(arguments)
      };
      g[e].t = 1 * new Date();
      g[e].c = es;
      ys = document.createElement('script'); 
      ys.async = 1; 
      ys.src = n; 
      ys.charset = 'utf-8'; 
      document.head.appendChild(ys);
    })(window, 'Genesys', 'https://apps.mypurecloud.de/genesys-bootstrap/genesys.min.js', {
      environment: 'prod-euc1',
      deploymentId: '10ac891d-60dd-40fc-86d8-4c803d4c0754'
    });

    function changeLanguage() {
      const locale = document.getElementById("languageSelect").value;
      localStorage.setItem("selectedLocale", locale);
      location.reload();
    }

    function saveEmail() {
      const email = document.getElementById("webUserEmail").value;
      localStorage.setItem("selectedEmail", email);
    }

    function initializeGenesys() {
      const locale = localStorage.getItem("selectedLocale") || "en-GB";
      const webUserEmail = localStorage.getItem("selectedEmail") || "";

      Genesys("command", "Database.set", {
        messaging: {
          customAttributes: {
            name: "",
            locale: locale,
            webUserEmail: webUserEmail
          }
        }
      });

      document.getElementById("languageSelect").value = locale;
      document.getElementById("webUserEmail").value = webUserEmail;
    }

    window.onload = initializeGenesys;
  </script>

</body>
</html>
